[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-ps"
dynamic = ["version"]
description = "PowerShell Radio Pro - Internet radio for Windows PowerShell"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "PowerShell Radio Pro Team"},
]
keywords = ["radio", "streaming", "audio", "vlc", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "python-vlc>=3.0.18",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]

[project.scripts]
radio = "radio_ps.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "radio_ps.__version__"}

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["venv", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# One-statement-per-line rules conflict with long-standing compact style in
# this codebase (table-driven one-liners); not worth churning 20+ sites.
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# selfcheck.py sets sys.path before imports and has wide ASCII-table output.
"scripts/*" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"